<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#F3F5F8"/>
<title>HR Visión Empresarial · Óptica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F3F5F8;--bg2:#FFFFFF;--bg3:#EEF1F6;
  --blue:#2563EB;--blue2:#1D4ED8;--blue3:rgba(37,99,235,0.10);
  --green:#2F8F5B;--green2:rgba(47,143,91,0.12);
  --amber:#B7791F;--amber2:rgba(183,121,31,0.13);
  --red:#C0392B;--red2:rgba(192,57,43,0.12);
  --purple:#6E5BA8;--purple2:rgba(110,91,168,0.13);
  --white:#161A1F;--gray:#8A93A6;--gray2:#5B6472;--gray3:#2A2E36;
  --border:rgba(15,23,42,0.08);--border2:rgba(15,23,42,0.15);
  --r:16px;--r2:12px;
  --font:'Inter',system-ui,sans-serif;
  --font-brand:'Playfair Display',serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--white)}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;height:100%}
.topbar{padding:calc(var(--safe-t) + 12px) 20px 12px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.2px;font-family:var(--font-brand)}
.topbar-sub{font-size:11px;color:var(--gray2);margin-top:1px}
.topbar-badge{background:var(--blue3);border:1px solid rgba(59,130,246,.3);color:var(--blue2);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.bottomnav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--safe-b);flex-shrink:0}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:none;background:none;color:var(--gray);font-size:10px;font-weight:600;font-family:var(--font);cursor:pointer;letter-spacing:.02em;text-transform:uppercase}
.bn.on{color:var(--blue2)}
.bn svg{width:22px;height:22px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 4px}
.stat-pill{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:relative;overflow:hidden}
.stat-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.sp-b::before{background:var(--blue)}.sp-g::before{background:var(--green)}.sp-r::before{background:var(--red)}.sp-a::before{background:var(--amber)}.sp-p::before{background:var(--purple)}
.sp-l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--gray2);font-weight:600}
.sp-v{font-size:18px;font-weight:800;margin-top:4px;line-height:1.1;word-break:break-word}
.sp-s{font-size:10px;color:var(--gray);margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:10px 16px 0}
.ch{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.ch-t{font-size:13px;font-weight:700;color:var(--gray3)}
.ch-a{background:none;border:none;color:var(--blue2);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer}
.pi{padding:13px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);cursor:pointer}
.pi:last-child{border-bottom:none}
.pi:active{background:rgba(15,23,42,.04)}
.av{width:42px;height:42px;border-radius:12px;background:var(--blue3);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--blue2);flex-shrink:0}
.av-r{background:var(--red2)!important;color:var(--red)!important}
.pi-info{flex:1;min-width:0}
.pi-n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-s{font-size:11.5px;color:var(--gray2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-r{text-align:right;flex-shrink:0}
.pi-amt{font-size:13px;font-weight:800;color:var(--blue2)}
.bdg{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700}
.bdg.paid{background:var(--green2);color:var(--green)}.bdg.partial{background:var(--amber2);color:var(--amber)}.bdg.pending{background:var(--red2);color:var(--red)}.bdg.prospecto{background:var(--purple2);color:var(--purple)}.bdg.activo{background:var(--green2);color:var(--green)}.bdg.costo{background:rgba(138,131,117,.2);color:var(--gray2)}
.av-p{background:var(--purple2)!important;color:var(--purple)!important}
.typetabs{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.typetabs::-webkit-scrollbar{display:none}
.typetab{flex:1 0 auto;min-width:82px;padding:11px 8px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--gray2);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;text-align:center;white-space:nowrap}
.typetab.on-a{background:var(--green2);border-color:var(--green);color:var(--green)}
.typetab.on-p{background:var(--purple2);border-color:var(--purple);color:var(--purple)}
.typetab.on-m{background:var(--amber2);border-color:var(--amber);color:var(--amber)}
.typetab.on-l{background:var(--blue3);border-color:var(--blue);color:var(--blue2)}
.pb{background:rgba(15,23,42,.08);border-radius:99px;height:5px}
.pf{height:100%;border-radius:99px;background:var(--blue)}
.pf.done{background:var(--green)}.pf.mid{background:var(--amber)}
.sw{padding:12px 16px 4px;position:relative}
.sw input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);padding:12px 14px 12px 40px;color:var(--white);font-size:16px;outline:none;font-family:var(--font);-webkit-appearance:none}
.sw input::placeholder{color:var(--gray)}
.sw input:focus{border-color:var(--blue)}
.si{position:absolute;left:29px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none}
.chips{display:flex;gap:8px;padding:8px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--border2);color:var(--gray2);background:none;white-space:nowrap;cursor:pointer;font-family:var(--font);flex-shrink:0}
.chip.on{background:var(--blue3);border-color:var(--blue);color:var(--blue2)}
.fab{position:fixed;bottom:calc(72px + var(--safe-b) + 14px);right:20px;width:56px;height:56px;background:var(--blue);border-radius:50%;border:none;color:white;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(59,130,246,.5);cursor:pointer;z-index:40}
.fab:active{transform:scale(.92)}
.empty{text-align:center;padding:56px 28px;color:var(--gray)}
.empty span{font-size:44px;display:block;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.6}

/* ── FORM — inputs never trigger re-render ── */
.fw{padding:0 16px}
.sl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue2);font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sl::after{content:'';flex:1;height:1px;background:var(--border2)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12px;color:var(--gray2);font-weight:600}
.f input,.f select{background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);padding:13px 14px;color:var(--white);font-size:16px;outline:none;font-family:var(--font);width:100%;-webkit-appearance:none}
.f input:focus,.f select:focus{border-color:var(--blue)}
.f input::placeholder{color:var(--gray)}
.f select option{background:var(--bg2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Computed readonly fields */
.ro-blue{background:rgba(59,130,246,.08)!important;border-color:rgba(59,130,246,.3)!important;color:var(--blue2)!important;font-weight:700!important}
.ro-green{background:rgba(34,197,94,.08)!important;border-color:rgba(34,197,94,.3)!important;color:var(--green)!important;font-weight:700!important}
.ro-amber{background:rgba(245,158,11,.08)!important;border-color:rgba(245,158,11,.3)!important;color:var(--amber)!important;font-weight:700!important}
.ro-red{background:rgba(239,68,68,.08)!important;border-color:rgba(239,68,68,.3)!important;color:var(--red)!important;font-weight:700!important}
/* Formula table */
.ftbl{width:100%;border:1.5px solid var(--border2);border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
.fr2{display:grid;grid-template-columns:46px 1fr 1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.fr2:last-child{border-bottom:none}
.fc{padding:9px 4px;text-align:center;font-size:12px}
.fc.hd{background:rgba(15,23,42,.05);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray2);font-weight:700}
.fc.ey{font-weight:800;color:var(--blue2);font-size:11px;background:rgba(59,130,246,.08);display:flex;align-items:center;justify-content:center}
.fc input{width:100%;background:transparent;border:none;outline:none;color:var(--white);font-size:14px;text-align:center;font-family:var(--font);padding:0}
.fc input::placeholder{color:var(--gray);font-size:12px}
.fr3{display:grid;grid-template-columns:84px 1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.fr3:last-child{border-bottom:none}
.mnav{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
.mnav button{width:38px;height:38px;flex-shrink:0;background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;color:var(--gray3);font-size:16px;font-weight:800;cursor:pointer;font-family:var(--font)}
.mnav input{flex:1;background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);padding:10px;color:var(--white);font-family:var(--font);font-size:14px;text-align:center;outline:none}
/* Saldo summary box */
.sb{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:10px}
.sbi{padding:12px 8px;text-align:center;border-right:1px solid var(--border)}
.sbi:last-child{border-right:none}
.sbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray2);font-weight:700}
.sbv{font-size:15px;font-weight:800;margin-top:4px;word-break:break-word}
.save-btn{width:100%;padding:16px;background:var(--blue);color:white;border:none;border-radius:var(--r2);font-size:16px;font-weight:800;font-family:var(--font);cursor:pointer;margin-top:8px;letter-spacing:-.2px}
.save-btn:active{background:#1D4ED8}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end}
.sh{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sh-hnd{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:10px auto 0}
.sh-head{padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sh-head h2{font-size:17px;font-weight:800}
.sh-scr{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;flex:1}
.dr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.dr-l{font-size:12px;color:var(--gray2);font-weight:500}
.dr-v{font-size:13px;font-weight:700;text-align:right;max-width:60%}
.sh-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.sh-foot button{flex:1;padding:13px;border-radius:var(--r2);border:none;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer}
.ab-form{background:var(--bg3);border:1px solid rgba(34,197,94,.2);border-radius:var(--r2);padding:14px;margin:12px 0}
.ab-ttl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);font-weight:700;margin-bottom:10px}
.ab-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ab-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:8px;padding:9px 12px}
.ab-amt{font-size:14px;font-weight:800;color:var(--green)}
.ab-dt{font-size:11px;color:var(--gray2)}
.ab-del{background:none;border:none;color:var(--gray);font-size:18px;cursor:pointer;padding:2px 6px}
.cb{background:var(--blue3);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cb-l{font-size:10px;color:var(--blue2);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.cb-v{font-size:20px;font-weight:800}
.sl2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue2);font-weight:700;margin:14px 0 8px}
.toast{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--blue);border-radius:12px;padding:11px 20px;font-size:13.5px;font-weight:600;z-index:200;white-space:nowrap;box-shadow:0 8px 32px rgba(15,23,42,.18);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.back-btn{background:none;border:none;color:var(--blue2);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;padding:0}

/* ── Login screen ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#FFFFFF 0%,#E7EDF7 70%);padding:24px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-top:3px solid var(--blue);border-radius:20px;padding:32px 26px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px -20px rgba(15,23,42,.20)}
.login-emoji{font-size:34px;margin-bottom:6px}
.login-card h2{font-family:var(--font-brand);font-size:20px;font-weight:700;color:var(--white);margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--gray2);margin-bottom:22px}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-error{display:none;font-size:12px;color:var(--red);background:var(--red2);padding:8px 10px;border-radius:8px;text-align:left}
.login-error.show{display:block}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-emoji">👁️</div>
    <h2>HR Visión Empresarial</h2>
    <p>Óptica · Ingresa para ver tus ventas</p>
    <form id="loginForm">
      <div class="f"><label>Correo electrónico</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="f"><label>Contraseña</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <button type="submit" class="save-btn" id="loginBtn">Ingresar</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<div id="app" style="display:none;"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const tod=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const ef=()=>({esfera:'',cilindro:'',eje:'',adicion:''});
const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// ── Conexión a Firebase / Firestore: los registros se guardan en la nube y se
// sincronizan solos entre todos los computadores que abran esta página.
const firebaseConfig = {
  apiKey: "AIzaSyBq-YQLDZ0LiA6l2ZmEu7KMMrjBT1-lyUw",
  authDomain: "ventas-optica-2a6bd.firebaseapp.com",
  projectId: "ventas-optica-2a6bd",
  storageBucket: "ventas-optica-2a6bd.firebasestorage.app",
  messagingSenderId: "215807997184",
  appId: "1:215807997184:web:ea9432154aa4a1fd016fe5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const ventasCol = db.collection('ventas');
const gastosCol = db.collection('gastos');

const tvp=p=>(parseFloat(p.valorLente)||0)+(parseFloat(p.valorMontura)||0);
const tcp=p=>(parseFloat(p.costoLente)||0)+(parseFloat(p.costoMontura)||0);
const tup=p=>p.esCosto?0:tvp(p)-tcp(p);
const tap=p=>(p.abonos||[]).reduce((s,a)=>s+a.monto,0);
const tsp=p=>tvp(p)-tap(p);
const estp=p=>{const v=tvp(p),a=tap(p);if(v===0)return'pending';if(a>=v)return'paid';if(a>0)return'partial';return'pending';};
const elbl=e=>e==='paid'?'Pagado':e==='partial'?'Parcial':'Pendiente';
const tcli=p=>p&&p.tipoCliente==='prospecto'?'prospecto':'activo';
const emptyRec=()=>({id:uid(),tipoCliente:'activo',esCosto:false,control:'',nombre:'',fecha:tod(),jornada:'',cedula:'',correo:'',edad:'',telefono:'',direccion:'',ciudad:'',od:ef(),oi:ef(),laboratorio:'',ordenLab:'',enviadoLab:false,entregado:false,tipoLente:'',valorLente:'',costoLente:'',montura:'',valorMontura:'',costoMontura:'',abonoInicial:'',abonos:[]});

// ── State ─────────────────────────────────────────────────────────────────────
let S={view:'home',records:[],gastos:[],search:'',filter:'all',clientType:'activo',form:emptyRec(),detail:null,toast:null,abAmt:'',abFecha:tod(),dashTab:'fin',dashMonth:new Date().toISOString().slice(0,7),jornadaOpen:null,gDesc:'',gMonto:'',gFecha:tod(),dashSearch:'',dashMFilter:'all'};
const app=document.getElementById('app');
let tTimer=null;

function showToast(msg){S.toast=msg;const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(tTimer);tTimer=setTimeout(()=>t.remove(),2400);}

// ── CRITICAL: Field update WITHOUT re-render ──────────────────────────────────
// Plain text / date / tel fields — just store, no redraw
function sf(k,v){ S.form[k]=v; }
// Formula fields
function sfx(eye,k,v){ S.form[eye][k]=v; }

// Numeric fields that affect computed values — store + update computed DOM only
function sfn(k,v){
  S.form[k]=v;
  updateComputed();
}
// Checkbox fields that affect computed values
function sfb(k,v){
  S.form[k]=v;
  updateComputed();
}

function updateComputed(){
  const f=S.form;
  const tot=(parseFloat(f.valorLente)||0)+(parseFloat(f.valorMontura)||0);
  const costo=(parseFloat(f.costoLente)||0)+(parseFloat(f.costoMontura)||0);
  const util=f.esCosto?0:(tot-costo);
  const ai=parseFloat(f.abonoInicial)||0;
  const sd=Math.max(0,tot-ai);
  const pct=tot>0?Math.min(100,(ai/tot)*100):0;

  // Total venta
  const elTot=document.getElementById('c-total');
  if(elTot) elTot.value=fmt(tot);

  // Utilidad
  const elUtil=document.getElementById('c-utilidad');
  if(elUtil){
    elUtil.value=fmt(util);
    elUtil.className=util>0?'ro-green':util<0?'ro-red':'ro-amber';
  }

  // Saldo
  const elSd=document.getElementById('c-saldo');
  if(elSd){
    elSd.value=tot>0?fmt(sd):'—';
    elSd.className='';
    if(tot>0){
      if(sd===0) elSd.className='ro-green';
      else if(ai>0) elSd.className='ro-amber';
      else elSd.className='ro-red';
    }
  }

  // Summary box
  const elSbTot=document.getElementById('sb-tot');
  const elSbAb=document.getElementById('sb-ab');
  const elSbSd=document.getElementById('sb-sd');
  const elSbox=document.getElementById('saldo-box');
  if(elSbox){
    if(tot>0){
      elSbox.style.display='grid';
      if(elSbTot) elSbTot.textContent=fmt(tot);
      if(elSbAb)  elSbAb.textContent=fmt(ai);
      if(elSbSd){
        elSbSd.textContent=fmt(sd);
        elSbSd.style.color=sd===0?'var(--green)':ai>0?'var(--amber)':'var(--red)';
      }
    } else {
      elSbox.style.display='none';
    }
  }

  // Progress bar
  const elPf=document.getElementById('pf-form');
  const elPl=document.getElementById('pl-form');
  const elPw=document.getElementById('pw-form');
  if(elPw) elPw.style.display=tot>0?'block':'none';
  if(elPf){
    elPf.style.width=pct+'%';
    elPf.className='pf'+(pct>=100?' done':pct>0?' mid':'');
  }
  if(elPl) elPl.textContent=pct.toFixed(0)+'% pagado al registrar';
}

// ── Navigation (full re-render only on view change) ───────────────────────────
function go(partial){
  // Flush current form input values before navigating away
  if(S.view==='new'||S.view==='edit') flushForm();
  Object.assign(S,partial);
  render(true);
}

// Read all live input values from DOM into S.form before save / navigate
function flushForm(){
  const ids=['tipoCliente','control','nombre','fecha','jornada','cedula','correo','edad','telefono','direccion','ciudad','laboratorio','ordenLab','tipoLente','valorLente','costoLente','montura','valorMontura','costoMontura','abonoInicial'];
  ids.forEach(k=>{const el=document.getElementById('fi-'+k);if(el)S.form[k]=el.value;});
  // Formula
  ['od','oi'].forEach(eye=>{
    ['esfera','cilindro','eje','adicion'].forEach(k=>{
      const el=document.getElementById('fi-'+eye+'-'+k);
      if(el)S.form[eye][k]=el.value;
    });
  });
}

async function doSave(){
  flushForm();
  if(!S.form.nombre.trim()){showToast('⚠️ El nombre es requerido');return;}
  const ai=parseFloat(S.form.abonoInicial)||0;
  let rec={...S.form};
  delete rec.abonoInicial;
  if(S.view==='new'&&ai>0) rec={...rec,abonos:[{id:uid(),monto:ai,fecha:rec.fecha}]};
  else if(S.view==='new') rec={...rec,abonos:[]};
  if(S.view==='new') rec={...rec,id:uid()};
  else S.detail=rec;
  try{
    await ventasCol.doc(rec.id).set(rec);
    showToast(S.view==='new'?'✅ Paciente guardado':'✅ Actualizado');
    S.view='list'; render();
  }catch(e){
    showToast('❌ No se pudo guardar. Revisa tu conexión.');
  }
}

async function doDel(id){
  if(!confirm('¿Eliminar este registro?'))return;
  try{
    await ventasCol.doc(id).delete();
    showToast('🗑️ Eliminado');S.detail=null;render();
  }catch(e){
    showToast('❌ No se pudo eliminar.');
  }
}

async function doAbono(){
  const m=parseFloat(document.getElementById('ab-amt-i').value||S.abAmt);
  const fecha=document.getElementById('ab-fecha-i').value||S.abFecha;
  if(!m||m<=0){showToast('⚠️ Valor inválido');return;}
  const p=S.detail;
  const upd={...p,abonos:[...(p.abonos||[]),{id:uid(),monto:m,fecha}]};
  try{
    await ventasCol.doc(p.id).set(upd);
    S.detail=upd;S.abAmt='';S.abFecha=tod();
    showToast('✅ Abono registrado');render();
  }catch(e){
    showToast('❌ No se pudo registrar el abono.');
  }
}

async function delAbono(pid,aid){
  const p=S.records.find(r=>r.id===pid);
  const upd={...p,abonos:p.abonos.filter(a=>a.id!==aid)};
  try{
    await ventasCol.doc(pid).set(upd);
    S.detail=upd;render();
  }catch(e){
    showToast('❌ No se pudo eliminar el abono.');
  }
}

async function doConvert(id){
  const p=S.records.find(r=>r.id===id);
  if(!p)return;
  const upd={...p,tipoCliente:'activo'};
  try{
    await ventasCol.doc(id).set(upd);
    S.detail=upd;
    showToast('✅ Convertido a Activo');render();
  }catch(e){
    showToast('❌ No se pudo actualizar.');
  }
}

async function doToggleField(id,field){
  const p=S.records.find(r=>r.id===id);
  if(!p)return;
  const upd={...p,[field]:!p[field]};
  try{
    await ventasCol.doc(id).set(upd);
    S.detail=upd;render();
  }catch(e){
    showToast('❌ No se pudo actualizar.');
  }
}

function setClientType(v){
  S.clientType=v;S.filter='all';S.search='';

function shiftMonth(delta){
  const[y,m]=S.dashMonth.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  S.dashMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render(true);
}

async function doAddGasto(){
  const desc=(S.gDesc||'').trim();
  const monto=parseFloat(S.gMonto)||0;
  const fecha=S.gFecha||tod();
  if(!desc||monto<=0){showToast('⚠️ Completa descripción y valor');return;}
  const g={id:uid(),descripcion:desc,monto,fecha};
  try{
    await gastosCol.doc(g.id).set(g);
    S.gDesc='';S.gMonto='';
    showToast('✅ Gasto agregado');render();
  }catch(e){
    showToast('❌ No se pudo agregar el gasto');
  }
}
async function delGasto(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  try{
    await gastosCol.doc(id).delete();
    showToast('🗑️ Gasto eliminado');render();
  }catch(e){
    showToast('❌ No se pudo eliminar');
  }
}
function toggleJornada(encName){
  const name=decodeURIComponent(encName);

  const vL=recs.reduce((s,r)=>s+(parseFloat(r.valorLente)||0),0);
  const vM=recs.reduce((s,r)=>s+(parseFloat(r.valorMontura)||0),0);
  const cL=recs.reduce((s,r)=>s+(parseFloat(r.costoLente)||0),0);
  const cM=recs.reduce((s,r)=>s+(parseFloat(r.costoMontura)||0),0);
  const uL=recs.reduce((s,r)=>s+(r.esCosto?0:(parseFloat(r.valorLente)||0)-(parseFloat(r.costoLente)||0)),0);
  const uM=recs.reduce((s,r)=>s+(r.esCosto?0:(parseFloat(r.valorMontura)||0)-(parseFloat(r.costoMontura)||0)),0);
  const totVenta=vL+vM,totCosto=cL+cM,utilBruta=uL+uM;
  const cobMes=recs.reduce((s,r)=>s+tap(r),0);

function vDashJornadas(){
  const withJ=S.records.filter(r=>r.jornada&&r.jornada.trim());
  const groups={};
  withJ.forEach(r=>{(groups[r.jornada]=groups[r.jornada]||[]).push(r);});
  const names=Object.keys(groups).sort((a,b)=>{
    const ma=groups[a].reduce((m,r)=>r.fecha>m?r.fecha:m,'');
    const mb=groups[b].reduce((m,r)=>r.fecha>m?r.fecha:m,'');
    return mb.localeCompare(ma);
  });
  if(!names.length) return`<div class="empty"><span>🗓️</span><p>Aún no has asignado pacientes a una jornada.<br>Agrega el campo "Jornada" al crear o editar un paciente.</p></div>`;
  return names.map(name=>{
    const grp=groups[name];
    const tot=grp.reduce((s,r)=>s+tvp(r),0);
    const cob=grp.reduce((s,r)=>s+tap(r),0);
    const pen=grp.reduce((s,r)=>s+Math.max(0,tsp(r)),0);
    const costo=grp.reduce((s,r)=>s+tcp(r),0);
    const util=grp.reduce((s,r)=>s+tup(r),0);
    const margen=tot>0?(util/tot)*100:0;
    const entregados=grp.filter(r=>r.entregado).length;
    const enviados=grp.filter(r=>r.enviadoLab).length;
    const isOpen=S.jornadaOpen===name;
    const enc=encodeURIComponent(name);
    return`
<div class="card" style="border-top:2.5px solid ${util>=0?'var(--purple)':'var(--red)'}">
  <div class="ch" style="cursor:pointer" onclick="toggleJornada('${enc}')">
    <span class="ch-t">🗓️ ${esc(name)}</span>
    <span class="ch-a">${isOpen?'▲ Ocultar':'▼ '+grp.length+' pac.'}</span>
  </div>
  <div style="padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--border)">

// ── Monturas: vista rápida para cruzar contra el inventario ──────────────────
function filterMonturaRecs(){
  const q=(S.dashSearch||'').toLowerCase();
  return S.records.filter(r=>tcli(r)==='activo').filter(r=>{
    const tieneMontura=!!(r.montura&&r.montura.trim());
    const matchQ=!q||r.nombre.toLowerCase().includes(q)||(r.montura||'').toLowerCase().includes(q)||(r.control||'').toLowerCase().includes(q);
    const matchF=S.dashMFilter==='all'||(S.dashMFilter==='with'&&tieneMontura)||(S.dashMFilter==='missing'&&!tieneMontura);
    return matchQ&&matchF;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

function renderMonturaRows(recs){
  if(!recs.length) return`<div class="empty"><span>🕶️</span><p>Sin resultados.<br>Prueba otro término o cambia el filtro.</p></div>`;
  return recs.map(r=>{
    const tieneMontura=!!(r.montura&&r.montura.trim());
    return`
<div class="pi" onclick="openDetail('${r.id}')">
  <div class="av${tieneMontura?'':' av-r'}">${r.nombre.charAt(0).toUpperCase()}</div>
  <div class="pi-info"><div class="pi-n">${r.nombre}</div><div class="pi-s">Ctrl ${r.control||'—'} · ${r.fecha}${tieneMontura?' · '+esc(r.montura):''}</div></div>
  <div class="pi-r">${tieneMontura?`<div class="pi-amt">${fmt(r.valorMontura)}</div>`:`<span class="bdg pending">⚠️ Sin montura</span>`}</div>
</div>`;
  }).join('');
}

function filterMonturas(){
  const el=document.getElementById('montura-list');
  if(el) el.innerHTML=renderMonturaRows(filterMonturaRecs());
}

function setDashMFilter(v){
  S.dashMFilter=v;
  document.querySelectorAll('#app .chips .chip[data-mf]').forEach(c=>{
    c.classList.toggle('on',c.getAttribute('data-mf')===v);
  });
  filterMonturas();
}

// ── Laboratorios: pacientes agrupados por laboratorio ─────────────────────────
function vDashLabs(){
  const withLab=S.records.filter(r=>r.laboratorio&&r.laboratorio.trim());
  const groups={};
  withLab.forEach(r=>{(groups[r.laboratorio]=groups[r.laboratorio]||[]).push(r);});
  const names=Object.keys(groups).sort((a,b)=>{
    const pa=groups[a].filter(r=>!r.enviadoLab).length,pb=groups[b].filter(r=>!r.enviadoLab).length;
    return pb-pa||a.localeCompare(b);
  });
  if(!names.length) return`<div class="empty"><span>🏢</span><p>Aún no has asignado un laboratorio a ningún paciente.<br>Selecciónalo al crear o editar el paciente.</p></div>`;
  return names.map(name=>{
    const grp=[...groups[name]].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const costoTot=grp.reduce((s,r)=>s+(parseFloat(r.costoLente)||0),0);
    const enviados=grp.filter(r=>r.enviadoLab).length;
    const entregados=grp.filter(r=>r.entregado).length;
    const faltantes=grp.filter(r=>!(parseFloat(r.costoLente)>0)||!(parseFloat(r.costoMontura)>0)).length;
    return`
<div class="card">
  <div class="ch"><span class="ch-t">🏢 ${esc(name)}</span><span class="topbar-badge" style="background:var(--blue3);color:var(--blue2)">${grp.length}</span></div>
  <div style="padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--gray2)">
    <span>Costo lentes: <b style="color:var(--white)">${fmt(costoTot)}</b></span>
    <span>📦 Enviados: <b style="color:var(--white)">${enviados}/${grp.length}</b></span>
    <span>✅ Entregados: <b style="color:var(--white)">${entregados}/${grp.length}</b></span>
    ${faltantes?`<span>⚠️ Faltan costos: <b style="color:var(--red)">${faltantes}</b></span>`:''}
  </div>
  ${grp.map(r=>{
    const faltaLente=!(parseFloat(r.costoLente)>0);
    const faltaMontura=!(parseFloat(r.costoMontura)>0);
    return`
  <div class="pi" onclick="openDetail('${r.id}')">
    <div class="av${tcli(r)==='prospecto'?' av-p':''}">${r.nombre.charAt(0).toUpperCase()}</div>
    <div class="pi-info"><div class="pi-n">${r.nombre}</div><div class="pi-s">Ctrl ${r.control||'—'} · Lente: ${faltaLente?'<b style="color:var(--red)">falta</b>':fmt(r.costoLente)} · Montura: ${faltaMontura?'<b style="color:var(--red)">falta</b>':fmt(r.costoMontura)}</div></div>
    <div class="pi-r"><span class="bdg ${r.enviadoLab?'paid':'pending'}">${r.enviadoLab?'📦 Enviado':'⏳ Sin enviar'}</span></div>
  </div>`;}).join('')}
</div>`;
  }).join('');
}

let _lastRenderView=null;
function render(forceTop){
  const scrollEl=document.querySelector('.scroll');
  const savedScroll=scrollEl?scrollEl.scrollTop:0;
  const viewChanged=S.view!==_lastRenderView;
  let html='';
  if(S.view==='home')      html=vHome();
  else if(S.view==='list') html=vList();
  else if(S.view==='dashboard') html=vDashboard();
  else                     html=vForm();
  const sheet=S.detail?vDetail():'';
  app.innerHTML=html+sheet;
  _lastRenderView=S.view;
  const newScrollEl=document.querySelector('.scroll');
  if(newScrollEl) newScrollEl.scrollTop=(viewChanged||forceTop)?0:savedScroll;
}

function doExport(){
  if(!window.XLSX){showToast('⚠️ Cargando librería, intenta en 2 segundos');return;}
  const rows=S.records.map(p=>({
    'Tipo':tcli(p)==='prospecto'?'Prospecto':'Activo',
    'A Costo':p.esCosto?'Sí':'No',
    'Control':p.control,'Fecha':p.fecha,'Jornada':p.jornada||'','Nombre':p.nombre,'Cédula':p.cedula,
    'Correo':p.correo,'Edad':p.edad,'Teléfono':p.telefono,'Dirección':p.direccion,
    'Ciudad':p.ciudad,
    'OD Esfera':p.od.esfera,'OD Cilindro':p.od.cilindro,'OD Eje':p.od.eje,'OD Adición':p.od.adicion,
    'OI Esfera':p.oi.esfera,'OI Cilindro':p.oi.cilindro,'OI Eje':p.oi.eje,'OI Adición':p.oi.adicion,
    'Laboratorio':p.laboratorio,'N° Orden Lab.':p.ordenLab,'Enviado a Lab':p.enviadoLab?'Sí':'No','Entregado':p.entregado?'Sí':'No',
    'Tipo Lente':p.tipoLente,'Valor Lente':parseFloat(p.valorLente)||0,'Costo Lente':parseFloat(p.costoLente)||0,
    'Montura':p.montura,'Valor Montura':parseFloat(p.valorMontura)||0,'Costo Montura':parseFloat(p.costoMontura)||0,
    'Total Venta':tvp(p),'Costo Total':tcp(p),'Utilidad':tup(p),
    'Total Abonado':tap(p),'Saldo Pendiente':Math.max(0,tsp(p)),
    'Estado':elbl(estp(p)),
    'Abonos':p.abonos.map(a=>a.fecha+': $'+a.monto).join(' | '),
  }));
  if(!rows.length){showToast('⚠️ No hay registros para exportar');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(()=>({wch:18}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Óptica');
  XLSX.writeFile(wb,'HR_Vision_Optica_'+new Date().toISOString().slice(0,10)+'.xlsx');
  showToast('✅ Excel descargado');
}

function doImport(){
  if(!window.XLSX){showToast('⚠️ Cargando librería, intenta en 2 segundos');return;}
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        const imp=rows.map(r=>({
          id:uid(),tipoCliente:String(r['Tipo']||'').toLowerCase().includes('prospecto')?'prospecto':'activo',
          esCosto:String(r['A Costo']||'').toLowerCase().startsWith('s'),
          control:String(r['Control']||''),nombre:r['Nombre']||'',fecha:r['Fecha']||tod(),jornada:r['Jornada']||'',
          cedula:String(r['Cédula']||''),correo:r['Correo']||'',edad:String(r['Edad']||''),telefono:String(r['Teléfono']||''),
          direccion:r['Dirección']||'',ciudad:r['Ciudad']||'',
          od:{esfera:String(r['OD Esfera']||''),cilindro:String(r['OD Cilindro']||''),eje:String(r['OD Eje']||''),adicion:String(r['OD Adición']||'')},
          oi:{esfera:String(r['OI Esfera']||''),cilindro:String(r['OI Cilindro']||''),eje:String(r['OI Eje']||''),adicion:String(r['OI Adición']||'')},
          laboratorio:r['Laboratorio']||'',ordenLab:String(r['N° Orden Lab.']||''),
          enviadoLab:String(r['Enviado a Lab']||'').toLowerCase().startsWith('s'),
          entregado:String(r['Entregado']||'').toLowerCase().startsWith('s'),
          tipoLente:r['Tipo Lente']||'',valorLente:r['Valor Lente']||'',costoLente:r['Costo Lente']||'',
          montura:r['Montura']||'',valorMontura:r['Valor Montura']||'',costoMontura:r['Costo Montura']||'',
          abonoInicial:'',
          abonos:r['Abonos']?String(r['Abonos']).split('|').filter(Boolean).map(s=>{
            const[fecha,resto]=(s.trim()).split(':');
            return{id:uid(),fecha:(fecha||'').trim(),monto:parseFloat((resto||'').replace(/[^0-9.]/g,''))||0};
          }):[],
        }));
        if(confirm('¿Importar '+imp.length+' registros? Se añadirán a los actuales.')){
          const batch=db.batch();
          imp.forEach(rec=>batch.set(ventasCol.doc(rec.id),rec));
          batch.commit()
            .then(()=>{showToast('✅ '+imp.length+' registros importados');render();})
            .catch(()=>{showToast('❌ No se pudieron importar los registros');});
        }
      }catch(err){showToast('❌ Error al leer el archivo');}
    };
    reader.readAsBinaryString(file);
  };
  inp.click();
}

// ── Sesión y sincronización en tiempo real ──────────────────────────────────
const loginScreen=document.getElementById('loginScreen');
const loginForm=document.getElementById('loginForm');
const loginEmail=document.getElementById('loginEmail');
const loginPassword=document.getElementById('loginPassword');
const loginBtn=document.getElementById('loginBtn');
const loginError=document.getElementById('loginError');

let ventasUnsubscribe=null;
let gastosUnsubscribe=null;

function startVentasListener(){
  return ventasCol.onSnapshot(snapshot=>{
    S.records=snapshot.docs.map(doc=>doc.data());
    render();
  },err=>{
    showToast('❌ No se pudo conectar con la base de datos');
  });
}

function startGastosListener(){
  return gastosCol.onSnapshot(snapshot=>{
    S.gastos=snapshot.docs.map(doc=>doc.data());
    render();
  },err=>{
    showToast('❌ No se pudo conectar los gastos');
  });
}

auth.onAuthStateChanged(user=>{
  if(user){
    loginScreen.style.display='none';
    app.style.display='block';
    if(!ventasUnsubscribe) ventasUnsubscribe=startVentasListener();
    if(!gastosUnsubscribe) gastosUnsubscribe=startGastosListener();
  }else{
    app.style.display='none';
    loginScreen.style.display='flex';
    if(ventasUnsubscribe){ventasUnsubscribe();ventasUnsubscribe=null;}
    if(gastosUnsubscribe){gastosUnsubscribe();gastosUnsubscribe=null;}
    S.records=[];S.gastos=[];S.view='home';S.detail=null;
  }
});

loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  loginError.className='login-error';
  loginBtn.disabled=true;loginBtn.textContent='Ingresando…';
  try{
    await auth.signInWithEmailAndPassword(loginEmail.value.trim(),loginPassword.value);
  }catch(err){
    let msg='No se pudo iniciar sesión. Verifica tu correo y contraseña.';
    if(err&&(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')) msg='Correo o contraseña incorrectos.';
    if(err&&err.code==='auth/invalid-email') msg='El correo no tiene un formato válido.';
    loginError.textContent=msg;
    loginError.className='login-error show';
  }finally{
    loginBtn.disabled=false;loginBtn.textContent='Ingresar';
  }
});
</script>
